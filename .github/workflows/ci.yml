name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same branch, but never
# cancels main — a red main should stay visible rather than vanish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Types, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `npm run build` type-checks as part of `tsc -b`, but running it
      # separately means a type error reports as a type error rather than as
      # a failed build.
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Browsers are a ~100MB download; key the cache on the resolved
      # Playwright version so it is reused until that changes.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        # Both projects are Chromium-based, so the other engines are not needed.
        # System dependencies are installed even on a cache hit, since they
        # live outside the cached directory.
        run: npx playwright install --with-deps chromium

      # The suite runs against the app in local-only mode: playwright.config.ts
      # blanks the Supabase variables, so no secrets are needed here and the
      # tests never touch the real database.
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
