<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diário da Prática</title>
    <meta
      name="description"
      content="Agenda, pacientes e anotações de sessão para uma prática de psicologia."
    />
    <!-- A private tool under a professional domain: reachable by link, but
         deliberately kept out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#3a1f2c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <!-- Open Graph. Search engines stay blocked in robots.txt; link-preview
         crawlers are allowed through so a shared link renders a card. Nothing
         here describes data: the app shows nothing at all without a sign-in. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agenda Psi" />
    <meta property="og:url" content="https://datapsi.com.br/" />
    <meta property="og:title" content="Agenda Psi — agenda e prontuário" />
    <meta
      property="og:description"
      content="Agenda, pacientes e anotações de sessão para uma prática de psicologia. Local-first, com sincronização opcional ponta a ponta: o servidor nunca vê o conteúdo."
    />
    <meta property="og:image" content="https://datapsi.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Agenda Psi — agenda e prontuário para uma prática de psicologia"
    />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The typeface is served from this origin; see @font-face in styles.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
