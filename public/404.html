<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Página não encontrada — Diário da Prática</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --desk: #3a1f2c;
        --page: #f5ecd8;
        --ink: #1e5c55;
        --text: #2a2018;
        --muted: #6b5d48;
      }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--desk);
        font-family: "DM Sans", system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--page);
        border-radius: 6px;
        box-shadow: 0 18px 40px rgba(20, 12, 10, 0.35);
        padding: 34px 30px;
        max-width: 420px;
      }
      h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.025em; color: var(--text); }
      p { margin: 10px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 20px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Página não encontrada</h1>
      <p>Esse endereço não existe por aqui. O diário continua no lugar de sempre.</p>
      <a href="/">← Abrir o diário</a>
    </div>
  </body>
</html>
